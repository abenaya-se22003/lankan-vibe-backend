spring.application.name=backend

# ===== Load .env file =====
spring.config.import=optional:file:.env[.properties]

# ===== Server Port (Supports Render's PORT and local SERVER_PORT) =====
server.port=${PORT:${SERVER_PORT:5000}}

# ===== PostgreSQL / Neon Database Connection =====
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate Settings =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Flyway Migration Settings =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ===== JWT Settings =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# ===== Cloudinary Settings =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:${CLOUD_NAME:dprastyf2}}
cloudinary.api-key=${CLOUDINARY_API_KEY:${CLOUD_API:571731628332311}}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:${CLOUD_SECRET:GpHhFk_bNGHqQdMMBImSzgbbdaY}}
cloudinary.folder=${CLOUDINARY_FOLDER:samples/Lankan vibe}

# ===== PayHere Sandbox Settings =====
payhere.merchant-id=${PAY_HERE_SANDBOX_API:${PAYHERE_MERCHANT_ID:4OVzEdMqDXU4JH5Y5BGnKA3D0}}
payhere.merchant-secret=${PAY_HERE_SANDBOX_SECRET:${PAYHERE_MERCHANT_SECRET:4JDDSALstIU8Qh7pA7WSDl4TnPep0Vp1l4jrvrG9h4D9}}
payhere.checkout-url=https://sandbox.payhere.lk/pay/checkout
payhere.currency=LKR

# ===== Email Configuration (JavaMailSender / SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:Lankan Vibe <no-reply@lankanvibe.com>}
app.mail.enabled=${MAIL_ENABLED:true}

# ===== Transactional Email API (Brevo / Resend over HTTPS port 443 - works on Render Free Tier) =====
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-sender-email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:thehufes@gmail.com}}
app.mail.brevo-sender-name=${BREVO_SENDER_NAME:Lankan Vibe}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.resend-from=${RESEND_FROM:Lankan Vibe <onboarding@resend.dev>}

